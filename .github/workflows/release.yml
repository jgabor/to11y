# Builds static Linux binaries, publishes a GitHub release, then publishes
# the crate to crates.io, when a version tag such as v0.1.0 is pushed.
# `just release 0.1.0` makes and pushes the tag.
#
# Each archive holds the binary at its root, for people who would rather
# download it than build it with `cargo install`.
# Nothing here uses a build cache, so a poisoned cache can't reach a release.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install dbus-daemon
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon
      - name: Install Rust
        run: rustup toolchain install
      - name: Version matches the tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml says $version, the tag is $TAG" >&2
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          name="to11y-${{ matrix.target }}"
          tar -czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" to11y
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          tar -tzf "$name.tar.gz" | grep -qx to11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: to11y-${{ matrix.target }}
          path: to11y-*.tar.gz*

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "to11y ${TAG#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease

  # Logs in with crates.io trusted publishing, so no token is stored in the
  # repository. Trusted publishing can't create a crate, so the first
  # version is published by hand; then add this workflow as the crate's
  # trusted publisher on crates.io.
  crates-io:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      # A rerun after a publish that went through skips this.
      - name: Check whether this version is published
        id: pending
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sfL "https://index.crates.io/to/11/to11y" \
              | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
            echo "to11y $version is already on crates.io"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        id: auth
        if: steps.pending.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: steps.pending.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
